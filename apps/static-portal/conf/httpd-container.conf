# Unprivileged Apache HTTPD listener drop-in for UBI10 containers
ServerName localhost
PidFile /tmp/httpd.pid
Mutex file:/tmp

<IfModule log_config_module>
    CustomLog /dev/stdout combined
</IfModule>
ErrorLog /dev/stderr

# Note: Comment out 'Listen 80' in /etc/httpd/conf/httpd.conf when running non-root
Listen 8080

<Location "/healthz">
    SetHandler None
</Location>
